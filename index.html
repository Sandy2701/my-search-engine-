<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Search - Kali Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }
        body {
            background-color: #0a0a12;
            color: #833ab4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        /* Kali Cyber Matrix Background Grid */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(131, 58, 180, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(131, 58, 180, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 1;
        }

        /* Ambient Glowing Dragon Aura */
        .background-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(131, 58, 180, 0.15) 0%, rgba(0, 173, 181, 0.05) 50%, transparent 100%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            pointer-events: none;
        }

        .search-container {
            text-align: center;
            width: 100%;
            max-width: 550px;
            margin-bottom: 60px;
            z-index: 10;
        }
        
        /* Kali Linux Theme Logo */
        h1 {
            font-size: 3.5rem;
            margin-bottom: 5px;
            color: #833ab4;
            text-shadow: 0 0 15px rgba(131, 58, 180, 0.6), 0 0 2px #00adb5;
            font-weight: bold;
            letter-spacing: 2px;
        }
        
        p.tagline {
            color: #00adb5;
            margin-bottom: 35px;
            font-size: 0.95rem;
            text-shadow: 0 0 8px rgba(0, 173, 181, 0.4);
        }
        
        /* Sleek Terminal Style Search Box */
        .search-box {
            display: flex;
            background: rgba(15, 15, 25, 0.85);
            border: 2px solid #833ab4;
            border-radius: 4px;
            padding: 10px 20px;
            width: 100%;
            align-items: center;
            box-shadow: 0 0 15px rgba(131, 58, 180, 0.2);
            backdrop-filter: blur(5px);
        }
        
        .search-box:focus-within {
            border-color: #00adb5;
            box-shadow: 0 0 20px rgba(0, 173, 181, 0.4);
        }
        
        .terminal-prompt {
            color: #00adb5;
            margin-right: 10px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 1.1rem;
            padding: 5px;
            font-family: inherit;
        }
        
        input::placeholder {
            color: #444466;
        }
        
        button {
            background: #833ab4;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 2px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(131, 58, 180, 0.4);
        }
        
        button:hover {
            background: #00adb5;
            color: #0a0a12;
            box-shadow: 0 0 15px rgba(0, 173, 181, 0.6);
        }
        
        /* Official Ownership Footer */
        footer {
            position: absolute;
            bottom: 20px;
            text-align: center;
            color: #444466;
            font-size: 0.85rem;
            width: 100%;
            left: 0
