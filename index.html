<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Search</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .search-container { text-align: center; }
        h1 { font-size: 3rem; margin-bottom: 20px; color: #00adb5; }
        .search-box {
            display: flex;
            background: #1e1e1e;
            border: 2px solid #333;
            border-radius: 30px;
            padding: 10px 20px;
            width: 400px;
        }
        input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 1.1rem;
        }
        button {
            background: #00adb5;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="search-container">
        <h1>Brain Search</h1>
        <div class="search-box">
            <input type="text" placeholder="Search..." id="query">
            <button onclick="alert('Searching for: ' + document.getElementById('query').value)">Search</button>
        </div>
    </div>

</body>
</html>
