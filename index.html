<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Search - Kali Edition</title>
    <style>
        * {
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Courier New', Courier, monospace; 
        }
        body {
            background-color: #0a0a12; 
            color: #833ab4; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            padding: 20px; 
            position: relative; 
            overflow: hidden; 
        }
        /* Kali Cyber Matrix Background Grid */
        body::before {
            content: ""; 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background-image: linear-gradient(rgba(131, 58, 180, 0.05) 1px, transparent 1px), 
                              linear-gradient(90deg, rgba(131, 58, 180, 0.05) 1px, transparent 1px); 
            background-size: 30px 30px;
            z-index: -1;
        }

        .search-container {
            text-align: center;
            z-index: 10;
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(131, 58, 180, 0.6);
            letter-spacing: 2px;
        }

        .search-form {
            display: flex;
            gap: 10px;
        }

        .search-input {
            flex: 1;
            padding: 15px;
            background: rgba(10, 10, 18, 0.8);
            border: 2px solid #833ab4;
            color: #bc4fe6;
            font-size: 1.2rem;
            outline: none;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(131, 58, 180, 0.2);
        }

        .search-input:focus {
            box-shadow: 0 0 25px rgba(131, 58, 180, 0.6);
            border-color: #bc4fe6;
        }

        .search-button {
            padding: 15px 30px;
            background: #833ab4;
            border: none;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .search-button:hover {
            background: #bc4fe6;
            box-shadow: 0 0 15px #bc4fe6;
        }
    </style>
</head>
<body>

    <div class="search-container">
        <h1>BRAIN_SEARCH //: KALI_EDITION</h1>
        
        <form class="search-form" id="searchForm">
            <input 
                type="text" 
                class="search-input" 
                id="searchQuery" 
                placeholder="Execute query..." 
                autofocus 
                required
            >
            <button type="submit" class="search-button">SEARCH</button>
        </form>
    </div>

    <script>
        // JavaScript to make the search actual functional
        document.getElementById('searchForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Stop the page from doing a default reload
            
            const query = document.getElementById('searchQuery').value;
            if (query.trim() !== "") {
                // Redirects the user to Google with their search query.
                // You can change 'google.com' to 'duckduckgo.com' if you want more privacy!
                window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
            }
        });
    </script>

</body>
</html>
