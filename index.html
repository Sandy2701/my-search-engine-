<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Brain Search - Kali Edition</title>
    <style>
        * {
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Courier New', Courier, monospace; 
        }
        body {
            background-color: #050b05; 
            color: #00ff00; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            padding: 20px; 
            position: relative; 
            overflow: hidden; 
        }
        /* Kali Cyber Matrix Green Background Grid */
        body::before {
            content: ""; 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background-image: linear-gradient(rgba(0, 255, 0, 0.08) 1px, transparent 1px), 
                              linear-gradient(90deg, rgba(0, 255, 0, 0.08) 1px, transparent 1px); 
            background-size: 25px 25px;
            z-index: -1;
        }

        .search-container {
            text-align: center;
            z-index: 10;
            width: 100%;
            max-width: 600px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(0, 255, 0, 0.8);
            letter-spacing: 2px;
            color: #00ff00;
        }

        .search-form {
            display: flex;
            gap: 10px;
        }

        .search-input {
            flex: 1;
            padding: 15px;
            background: rgba(5, 15, 5, 0.85);
            border: 2px solid #00ff00;
            color: #39ff14;
            font-size: 1.2rem;
            outline: none;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }

        .search-input:focus {
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.8);
            border-color: #39ff14;
        }

        .search-button {
            padding: 15px 30px;
            background: #00ff00;
            border: none;
            color: #050b05;
            font-size: 1.2rem;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .search-button:hover {
            background: #39ff14;
            box-shadow: 0 0 20px #39ff14;
            color: #000;
        }

        /* Footer Ownership Style */
        footer {
            width: 100%;
            text-align: center;
            padding: 15px 0;
            font-size: 0.85rem;
            color: rgba(0, 255, 0, 0.5);
            letter-spacing: 1px;
            z-index: 10;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.2);
        }
    </style>
</head>
<body>

    <div class="search-container">
        <h1>BRAIN_SEARCH //: KALI_EDITION</h1>
        
        <form class="search-form" id="searchForm" autocomplete="off" onsubmit="executePrivateSearch(event)">
            <input 
                type="text" 
                class="search-input" 
                id="searchQuery" 
                placeholder="Execute encrypted query..." 
                autofocus 
                required
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
            >
            <button type="submit" class="search-button">SEARCH</button>
        </form>
    </div>

    <footer>
        All Rights Reserved by SA Traders Since 2011
    </footer>

    <script>
        function executePrivateSearch(e) {
            e.preventDefault(); 
            
            const queryField = document.getElementById('searchQuery');
            const query = queryField.value.trim();
            
            if (query !== "") {
                // Route via specialized non-tracking HTML endpoint
                const secureTarget = `https://html.duckduckgo.com/html/?q=${encodeURIComponent(query)}`;
                
                // Instantly wipe the text input field locally
                queryField.value = "";
                
                // Replaces local session frame history so pressing "Back" won't reveal the query
                window.location.replace(secureTarget);
            }
        }
    </script>

</body>
</html>
